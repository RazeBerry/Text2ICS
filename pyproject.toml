[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventcalendar"
version = "2.0.0"
description = "Natural Language Calendar Event Creator - Convert text and images to calendar events using AI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "PyQt6>=6.7.0,<7.0.0",
    "google-genai>=1.66.0,<2.0.0",
    "Pillow>=12.3.0,<13.0.0",
    "icalendar>=6.1.0,<7.0.0",
    "pytz>=2025.2,<2027.0",
    "python-dateutil>=2.9.0,<3.0.0",
    "tzlocal>=5.2,<6.0",
    "python-dotenv>=1.1.0,<2.0.0",
    "keyring>=25.6.0,<26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.0.0",
    "ruff>=0.6.0",
    "vulture>=2.10",
    "pytest-cov>=6.0.0",
]

[project.scripts]
eventcalendar = "eventcalendar.__main__:main"

[project.gui-scripts]
eventcalendar-gui = "eventcalendar.__main__:main"

[tool.setuptools.package-data]
eventcalendar = ["resources/*.png", "resources/*.icns"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"

[tool.vulture]
ignore_decorators = ["@pytest.fixture"]
ignore_names = [
    "paintEvent",
    "dragEnterEvent",
    "dropEvent",
    "qt_app",
    "create_calendar_event",
    "from_dict",
    "to_dict",
    "__getattr__",
    "start_timezone",
    "end_timezone",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"Calender.py" = ["E402"]
"api_client.py" = ["E402"]
"config.py" = ["E402"]
"exceptions.py" = ["E402"]
