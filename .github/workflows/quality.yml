name: Quality

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      EVENTCALENDAR_RUN_UI_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: vulture src/eventcalendar Calender.py api_client.py config.py exceptions.py
      - run: pytest --cov=eventcalendar --cov-report=term-missing --cov-fail-under=65

  package-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip build pip-audit
      - run: sudo apt-get update && sudo apt-get install --yes libegl1 libgl1
      - run: python -m build
      - run: pip-audit -r requirements.lock --no-deps --disable-pip
      - run: pip install dist/*.whl
      - run: cd /tmp && python -c "from eventcalendar import CalendarAPIClient, CalendarEvent, NLCalendarCreator; print(CalendarEvent.__name__)"
